<div class="login-container">
    <h2>Login</h2>
    <section class="login-form">
        <form (ngSubmit)="onLogin()">
            <div class="form-group">
                <label for="nickUsuario">Usuario</label>
                <input
                    class="controls"
                    type="text"
                    id="nickUsuario"
                    name="nickUsuario"
                    placeholder="Introduce tu usuario"
                    [(ngModel)]="nickUsuario"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contrasena</label>
                <input
                    class="controls"
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Introduce tu contrasena"
                    [(ngModel)]="contrasena"
                    required
                >
            </div>

            <p class="errorClass" *ngIf="errorMessage">{{ errorMessage }}</p>

            <button type="submit">Login</button>
            <p><a href="#">Olvidaste tu contrasena?</a></p>
        </form>
    </section>
</div>
